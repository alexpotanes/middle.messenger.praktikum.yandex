<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>middle.messenger.praktikum.yandex</title>
    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body>
    <div class="wrapper">
      <section class="modal-block">
        <h2 class="modal-block__title">Регистрация</h2>
        <form action="" class="modal-block__form">
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="email">
              Почта
            </label>
            <input class="modal-block__input" type="email" id="email" />
          </div>
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="modal">
              Логин
            </label>
            <input class="modal-block__input" type="text" id="modal" />
          </div>
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="name">
              Имя
            </label>
            <input class="modal-block__input" type="text" id="name" />
          </div>
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="surname">
              Фамилия
            </label>
            <input class="modal-block__input" type="text" id="surname" />
          </div>
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="phone">
              Телефон
            </label>
            <input class="modal-block__input" type="tel" id="phone" />
          </div>
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="password">
              Пароль
            </label>
            <input class="modal-block__input" type="tel" id="password" />
          </div>
          <div class="modal-block__input-wrap">
            <label class="modal-block__label" for="password-rewrite">
              Пароль
            </label>
            <input class="modal-block__input" type="tel" id="password-rewrite" />
          </div>
          <button class="modal-block__button">Зарегистрироваться</button>
          <a href="#" class="modal-block__link">Войти</a>
        </form>
      </section>
    </div>
  </body>
</html>
