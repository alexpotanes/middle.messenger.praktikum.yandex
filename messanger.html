<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>middle.messenger.praktikum.yandex</title>
    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body class="page-chat">
    <div class="chats">
      <header class="chats__header">
        <div class="chats__profile"><span>Профиль</span></div>
        <input type="text" placeholder="Поиск" class="chats__search" />
      </header>
      <section class="chats__chat">
        <ul class="chats__list">
          <li class="chats__item chat">
            <div class="chat__avatar"></div>
            <div class="chat__data">
              <h3 class="chat__name">Андрей</h3>
              <p class="chat__message">Изображение</p>
            </div>
            <div class="chat__info">
              <span class="chat__time">10:49</span>
              <span class="chat__undead-count">2</span>
            </div>
          </li>
        </ul>
      </section>
    </div>
  </body>
</html>
